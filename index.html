<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link rel="stylesheet" href="css/style.css" />

    <title>EngineerOS</title>
  </head>

  <body>
    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header class="header">
      <div class="logo">
        <span class="logo-icon">🚀</span>

        <h1>Engineer<span class="accent">OS</span></h1>
      </div>

      <nav
        class="nav"
        aria-label="Main Navigation"
      >
        <a href="#" class="active">Dashboard</a>
        <a href="#">Projects</a>
        <a href="#">DSA</a>
        <a href="#">Roadmap</a>
        <a href="#">Community</a>
      </nav>

      <div class="header-actions">
        <div class="search-box">
          <span class="search-icon">🔍</span>

          <input
            type="text"
            placeholder="Search..."
          />

          <span class="shortcut">Ctrl + K</span>
        </div>

        <button
          class="notification-btn"
          aria-label="Notifications"
        >
          🔔
        </button>

        <button
          class="profile-btn"
          aria-label="Open profile menu"
        >
          <span>Fazal</span>

          <span>👤</span>
        </button>
      </div>
    </header>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main class="main">

      <!-- ========================= -->
      <!-- HERO -->
      <!-- ========================= -->

      <section class="hero">
        <div class="container hero-container">

          <div class="hero-content">
            <h2>👋 Good Evening, Fazal</h2>

            <p>Keep building. Every commit counts.</p>
          </div>

          <div class="stats">

            <div class="stat-card orange">
              <div class="card-top"></div>

              <div class="card-content">
                <span class="emoji">🔥</span>

                <h3>15</h3>

                <p>Coding Streak</p>
              </div>
            </div>

            <div class="stat-card blue">
              <div class="card-top"></div>

              <div class="card-content">
                <span class="emoji">📚</span>

                <h3>3</h3>

                <p>Learning Modules</p>
              </div>
            </div>

            <div class="stat-card purple">
              <div class="card-top"></div>

              <div class="card-content">
                <span class="emoji">💻</span>

                <h3>5</h3>

                <p>Projects</p>
              </div>
            </div>

            <div class="stat-card green">
              <div class="card-top"></div>

              <div class="card-content">
                <span class="emoji">⏱</span>

                <h3>18h</h3>

                <p>This Week</p>
              </div>
            </div>

          </div>

        </div>
      </section>

      <!-- ========================= -->
      <!-- TODAY'S MISSION -->
      <!-- ========================= -->

      <section class="today-mission">
        <div class="container today-mission-container">

          <header class="mission-header">
            <h2>🎯 Today's Mission</h2>

            <p>Focus on what matters most today.</p>
          </header>

          <ul class="mission-list">

            <li class="mission-card">
              <label class="mission-label">

                <input type="checkbox" />

                <div class="mission-content">

                  <p class="mission-label-text">
                    DSA FOCUS
                  </p>

                  <h3>2 Binary Search Problems</h3>

                  <div class="mission-meta">

                    <span class="meta-tag practice">
                      🧩 Practice
                    </span>

                    <span class="meta-tag high">
                      🔴 High Priority
                    </span>

                    <span class="meta-tag time">
                      ⏱ 40 min
                    </span>

                  </div>

                </div>

              </label>
            </li>

            <li class="mission-card">
              <label class="mission-label">

                <input type="checkbox" />

                <div class="mission-content">

                  <p class="mission-label-text">
                    BUILD FOCUS
                  </p>

                  <h3>EngineerOS Today's Mission</h3>

                  <div class="mission-meta">

                    <span class="meta-tag build">
                      💻 Project
                    </span>

                    <span class="meta-tag medium">
                      🟡 Medium Priority
                    </span>

                    <span class="meta-tag time">
                      ⏱ 60 min
                    </span>

                  </div>

                </div>

              </label>
            </li>

            <li class="mission-card">
              <label class="mission-label">

                <input type="checkbox" />

                <div class="mission-content">

                  <p class="mission-label-text">
                    LEARNING FOCUS
                  </p>

                  <h3>JavaScript Fundamentals</h3>

                  <div class="mission-meta">

                    <span class="meta-tag learning">
                      📚 Learning
                    </span>

                    <span class="meta-tag medium">
                      🟡 Medium Priority
                    </span>

                    <span class="meta-tag time">
                      ⏱ 30 min
                    </span>

                  </div>

                </div>

              </label>
            </li>

            <li class="mission-card">
              <label class="mission-label">

                <input type="checkbox" />

                <div class="mission-content">

                  <p class="mission-label-text">
                    GIT FOCUS
                  </p>

                  <h3>Commit &amp; Push to GitHub</h3>

                  <div class="mission-meta">

                    <span class="meta-tag git">
                      🚀 GitHub
                    </span>

                    <span class="meta-tag low">
                      🟢 Low Priority
                    </span>

                    <span class="meta-tag time">
                      ⏱ 10 min
                    </span>

                  </div>

                </div>

              </label>
            </li>

          </ul>

          <section class="mission-progress">

            <div class="progress-header">

              <h3>Today's Progress</h3>

              <span>0 / 4 Completed</span>

            </div>

            <div class="progress-bar">
              <div class="progress-fill"></div>
            </div>

          </section>

        </div>
      </section>

    </main>
  
    <script src="js/script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Sign in — EngineerOS</title>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="auth-brand" href="../index.html">🚀 Engineer<span>OS</span></a>
      <section class="auth-card" aria-labelledby="authTitle">
        <div class="auth-tabs" role="tablist" aria-label="Account actions">
          <button class="active" type="button" data-auth-mode="login">Sign in</button>
          <button type="button" data-auth-mode="register">Create account</button>
        </div>
        <h1 id="authTitle">Welcome back</h1>
        <p id="authSubtitle">Sign in to continue building your EngineerOS.</p>
        <p id="authMessage" class="auth-message" aria-live="polite"></p>
        <form id="authForm" data-mode="login">
          <label id="authNameField" hidden>
            Name
            <input id="authName" type="text" maxlength="100" autocomplete="name" />
          </label>
          <label>
            Email
            <input id="authEmail" type="email" autocomplete="email" required />
          </label>
          <label>
            Password
            <input id="authPassword" type="password" minlength="8" autocomplete="current-password" required />
          </label>
          <button id="authSubmitButton" class="auth-submit" type="submit">Sign in</button>
        </form>
      </section>
    </main>
    <script src="../js/auth.js"></script>
  </body>
</html>
